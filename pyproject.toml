[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-filaments"
version = "0.2.0"
description = "Physics-grounded synthetic solar filaments for GONG H-alpha images"
requires-python = ">=3.12,<3.14"
dependencies = [
    "h5py>=3.12,<4",
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "scikit-image>=0.25,<1",
    "scipy>=1.14,<2",
    "threadpoolctl>=3.5,<4",
    "tqdm>=4.69.1",
]

[project.optional-dependencies]
detector = [
    "timm>=1.0,<2",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers>=4.49,<5",
]
notebook = [
    "ipykernel>=6.29,<7",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]
gui = [
    "streamlit>=1.49,<2",
    "tomli-w>=1.2,<2",
]
quality = [
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["synthetic_filaments*"]

[tool.setuptools.package-data]
synthetic_filaments = ["data/*.csv", "data/*.npz"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
