<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">FILOS — A solar Filament Oscillation Simulator</title>
  <desc id="desc">Dark title panel with a schematic of curved filament threads. Decorative illustration, not simulation output.</desc>
