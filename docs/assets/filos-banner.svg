      <stop offset="0.5" stop-color="#f6c583"/>
      <stop offset="1" stop-color="#e79552" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="panel"><rect width="1200" height="270" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#panel)">
