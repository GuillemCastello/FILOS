    <text x="46" y="135" fill="#f5f7fa" font-family="system-ui, sans-serif" font-size="76" font-weight="650" letter-spacing="7">FILOS</text>
    <text x="50" y="181" fill="#b9cbd6" font-family="system-ui, sans-serif" font-size="23">A solar Filament Oscillation Simulator</text>
    <text x="50" y="223" fill="#88a2b4" font-family="system-ui, sans-serif" font-size="13" letter-spacing="2">GEOMETRY / PLASMA / DYNAMICS</text>
